name: Publicar Meta (Instagram + Facebook)

on:
  schedule:
    - cron: "*/15 * * * *"   # a cada 15 min (o GitHub pode atrasar alguns minutos)
  workflow_dispatch:
    inputs:
      modo:
        description: "publicar | verificar | simular"
        default: "publicar"

concurrency:
  group: calendario
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publicar
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
        run: |
          case "${{ github.event.inputs.modo || 'publicar' }}" in
            verificar) python automacao/publicar_meta.py --verificar ;;
            simular)   python automacao/publicar_meta.py --simular ;;
            *)         python automacao/publicar_meta.py ;;
          esac
      - name: Salvar status no calendário
        if: always()
        run: |
          if ! git diff --quiet calendario.json; then
            git config user.name "publicador-clean"
            git config user.email "publicador-clean@users.noreply.github.com"
            git add calendario.json
            git commit -m "Publicador: status atualizado $(TZ=America/Sao_Paulo date '+%d/%m %H:%M')"
            for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
          fi
